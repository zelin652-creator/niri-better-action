name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public version'
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  RUN_SLOW_TESTS: 1

jobs:
  prepare-release:
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Check for unreplaced "Since:" in the wiki
        run: |
          # Fail if a match is found (exit code 0)
          grep --recursive 'Since: next release' docs/wiki && exit 1

          # Fail if grep failed (exit code 2)
          status=$?
          if [ $status -ne 1 ]; then exit $status; fi

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libadwaita-1-dev meson ninja-build hwdata

      # Ubuntu 24.04 has libdisplay-info 0.1 (libdisplay-info.so.1), while newer distributions
      # ship 0.2 or 0.3 under a different soname. Link it statically so the release binary
      # runs on both.
      - name: Build static libdisplay-info
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o libdisplay-info.tar.gz https://gitlab.freedesktop.org/emersion/libdisplay-info/-/archive/0.3.0/libdisplay-info-0.3.0.tar.gz
          echo "2b467e3336aec63819d6aca28d7310d3dc7415b2b3a3c3a5aec9d3727053c078  libdisplay-info.tar.gz" | sha256sum -c
          tar -xzf libdisplay-info.tar.gz
          meson setup di-build libdisplay-info-0.3.0 --prefix="$RUNNER_TEMP/di" --libdir=lib \
            --default-library=static --buildtype=release
          ninja -C di-build install
          echo "PKG_CONFIG_PATH=$RUNNER_TEMP/di/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "SYSTEM_DEPS_LIBDISPLAY_INFO_LINK=static" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - name: Create vendored dependencies archive
        run: |
          mkdir .cargo
          cargo vendor --locked > .cargo/config.toml
          tar cJf niri-${{ github.event.inputs.version }}-vendored-dependencies.tar.xz vendor/

      - name: Build
        run: cargo build --all --frozen --release

      - name: Check shared library dependencies
        run: |
          readelf -d target/release/niri | grep NEEDED
          if readelf -d target/release/niri | grep -q libdisplay-info; then
            echo "libdisplay-info should be linked statically" >&2
            exit 1
          fi

      - name: Build tests
        run: cargo test --no-run --all --frozen --release

      - name: Test
        run: cargo test --all --frozen --release -- --nocapture

      # Same layout as the generate-rpm / deb assets in Cargo.toml, so it can be
      # installed with `sudo tar -xzf niri-*-x86_64-linux.tar.gz -C /`.
      - name: Package binary
        run: |
          pkg=niri-${{ github.event.inputs.version }}-x86_64-linux
          root=dist/$pkg
          install -Dm755 -t $root/usr/bin target/release/niri resources/niri-session
          strip $root/usr/bin/niri
          install -Dm644 -t $root/usr/share/wayland-sessions resources/niri.desktop
          install -Dm644 -t $root/usr/share/xdg-desktop-portal resources/niri-portals.conf
          install -Dm644 -t $root/usr/lib/systemd/user resources/niri.service resources/niri-shutdown.target
          install -Dm644 -t $root/usr/share/doc/niri README.md
          install -Dm644 -t $root/usr/share/licenses/niri LICENSE
          tar -czf $pkg.tar.gz -C $root usr
          sha256sum $pkg.tar.gz > $pkg.tar.gz.sha256

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ github.event.inputs.version }}
          # Tag the branch that was built, not the default branch. (A commit SHA here makes
          # GITHUB_TOKEN fail with "Resource not accessible by integration".)
          target_commitish: ${{ github.ref_name }}
          body: Built from ${{ github.sha }} on ${{ github.ref_name }}.
          files: |
            niri-${{ github.event.inputs.version }}-x86_64-linux.tar.gz
            niri-${{ github.event.inputs.version }}-x86_64-linux.tar.gz.sha256
            niri-${{ github.event.inputs.version }}-vendored-dependencies.tar.xz
          fail_on_unmatched_files: true
